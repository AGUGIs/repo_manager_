<form method="get" class="card entity-card search-form">
    <input type="hidden" name="search" value="1">
    <div><label for="query">Название репозитория или проекта</label><input type="search" id="query" name="q" value="{{ query }}" maxlength="200"></div>
    <div><label for="visibility">Режим доступа</label><select id="visibility" name="visibility">
        <option value="all"{% if visibility == 'all' %} selected{% endif %}>Любой</option>
        <option value="public"{% if visibility == 'public' %} selected{% endif %}>Открытый</option>
        <option value="private"{% if visibility == 'private' %} selected{% endif %}>Закрытый</option>
    </select></div>
    <div><label for="project-id">Проект</label><select id="project-id" name="project_id">
        <option value="">Все проекты</option>
        {% for item in projects %}<option value="{{ item.id }}"{% if selected_project == item.id|stringformat:'s' %} selected{% endif %}>{{ item.title|default:'Без названия' }}</option>{% endfor %}
    </select></div>
    <div><label for="user-id">Без активного доступа пользователя</label><select id="user-id" name="user_id">
        <option value="">Не учитывать</option>
        {% for user in users %}<option value="{{ user.id }}"{% if selected_user == user.id|stringformat:'s' %} selected{% endif %}>{{ user.full_name }} ({{ user.username }})</option>{% endfor %}
    </select></div>
    <div><label for="sort">Сортировка</label><select id="sort" name="sort">
        {% for value,label in sort_options %}<option value="{{ value }}"{% if sort == value %} selected{% endif %}>{{ label }}</option>{% endfor %}
    </select></div>
    <button class="btn btn-primary" type="submit">Найти</button>
</form>
