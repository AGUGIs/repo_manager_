[flake8]
exclude = .venv,.git,__pycache__,.idea
max-line-length = 79

[pycodestyle]
max-line-length = 79
exclude = .venv,.git,__pycache__,.idea

[tool:pytest]
testpaths = tests
pythonpath = .

[mypy]
python_version = 3.12
ignore_missing_imports = True
check_untyped_defs = True
exclude = (?x)(
    \.venv/
    | \.git/
    | tests/
    )
