{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Repo Manager{% endblock %} | Менеджер репозиториев</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="{% static 'homepage/css/style.css' %}">
    <script src="{% static 'homepage/js/main.js' %}" defer></script>
</head>
<body>
    <a class="skip-link" href="#main-content">К содержимому</a>
    <header class="site-header">
        <a class="brand" href="{% url 'homepage:index' %}">
            <img src="{% static 'homepage/img/logo.svg' %}" alt="" width="44" height="44">
            <span>Repo Manager<small>Менеджер репозиториев</small></span>
        </a>
    </header>
    {% include 'includes/navigation.html' %}
    <main id="main-content" class="container page-content">
        {% block content %}{% endblock %}
    </main>
    <footer class="site-footer">
        <p>© <span id="current-year">{% now 'Y' %}</span> Repo Manager</p>
        <p>Учебный проект · Челышев Кирилл · ЭФБО-10-24</p>
    </footer>
</body>
</html>
